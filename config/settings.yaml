# NEXUS Configuration Settings

# Application Settings
log_level: INFO
log_format: json
workspace_base: workspace
max_jobs_per_provider: 5

# Provider Settings
providers:
  kaggle:
    enabled: true
    priority: 1
    timeout: 30
    max_retries: 3
    retry_delay: 1.0
  colab:
    enabled: true
    priority: 2
    timeout: 30
    max_retries: 3
    retry_delay: 1.0
  huggingface:
    enabled: true
    priority: 3
    timeout: 30
    max_retries: 3
    retry_delay: 1.0

# Training Settings
training:
  default_method: qlora
  default_batch_size: 2
  default_learning_rate: 0.0001
  default_epochs: 3
  default_max_sequence_length: 2048
  default_gradient_checkpointing: true
  default_mixed_precision: bfloat16
  default_use_4bit: true
  default_bnb_4bit_compute_dtype: bfloat16
  default_bnb_4bit_quant_type: nf4
  default_bnb_4bit_double_quant: true
  default_max_memory_usage: 0.8
  default_gpu_timeout_hours: 24

# Evaluation Settings
evaluation:
  models: [llama2, codealpaca, qwen]
  metrics: [accuracy, f1, bleu, rouge]
  timeout: 300
  max_samples: 100
  temperature: 0.7
  top_p: 0.9
  top_k: 50

# Job Settings
job:
  max_jobs_per_provider: 5
  job_timeout_hours: 24
  checkpoint_interval: 100
  save_checkpoints: true
  max_checkpoint_size_mb: 10000
  cleanup_old_checkpoints: true

# Security Settings
security:
  require_authentication: true
  allow_public_models: false
  dataset_validation_required: true
  enable_audit_logging: true
  log_sensitive_data: false
  max_file_upload_size_mb: 100
  allowed_file_extensions: [".json", ".yaml", ".yml", ".txt", ".py"]