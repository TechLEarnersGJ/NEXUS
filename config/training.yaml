# NEXUS Training Configuration

# Training Methods
training_methods:
  sft:
    name: "Supervised Fine-tuning"
    description: "Standard supervised fine-tuning with full model parameters"
    parameter_effort: "high"
    memory_requirement: "high"
    recommended_gpu_memory_gb: 24
  lora:
    name: "Low-rank Adaptation"
    description: "LoRA fine-tuning with parameter-efficient layers"
    parameter_effort: "low"
    memory_requirement: "low"
    recommended_gpu_memory_gb: 8
  qlora:
    name: "Quantized LoRA"
    description: "LoRA with 4-bit quantization for maximum efficiency"
    parameter_effort: "very_low"
    memory_requirement: "very_low"
    recommended_gpu_memory_gb: 8

# Hyperparameter presets
hyperparameters:
  learning_rate: [0.0001, 0.00005, 0.00002]
  batch_size: [1, 2, 4]
  max_sequence_length: [512, 1024, 2048]
  num_epochs: [1, 2, 3]
  lora_r: [8, 16, 32]
  lora_alpha: [16, 32, 64]

# GPU requirements for different models
gpu_requirements:
  t4:
    memory_gb: 14.56
    recommended_method: qlora
  a100:
    memory_gb: 40
    recommended_method: qlora

# Evaluation benchmarks
evaluation:
  benchmarks: ["hellaswag", "bigbench", "gsm8k", "mmlu"]
  metrics: ["accuracy", "f1", "bleu", "rouge", "perplexity"]